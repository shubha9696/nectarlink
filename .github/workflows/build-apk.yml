name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "custom-features", "main" ]

jobs:
  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and Android targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "16111833"
          packages: "platforms;android-34 ndk;27.0.12077973 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v3
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug -Pnectarlink.abis=arm64-v8a --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Nectarlink-Custom-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
